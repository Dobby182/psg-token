name: Supabase keep-alive
on:
  schedule:
    - cron: "0 6 */5 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SB_TABLE: ${{ secrets.SUPABASE_TABLE }}
        run: |
          code=$(curl -sS -A "gh-keepalive" -D headers.txt -o body.txt -w "%{http_code}" \
            "$SB_URL/rest/v1/$SB_TABLE?limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "UTC: $(date -u)"
          echo "HTTP: $code"
          ref=$(grep -i '^sb-project-ref' headers.txt | tr -d '\r')
          echo "$ref"
          echo "Body bytes: $(wc -c < body.txt)"
          if [ "$code" != "200" ] || ! echo "$ref" | grep -q "fjsophsdlvqqcwmsleln"; then
            echo "Keep-alive FAILED"
            exit 1
          fi
          echo "Keep-alive OK"
